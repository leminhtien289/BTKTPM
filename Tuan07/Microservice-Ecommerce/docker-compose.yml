version: '3.8'

services:
  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:8080"
    environment:
      - PRODUCT_SERVICE_URL=http://product-service:8081
      - CUSTOMER_SERVICE_URL=http://customer-service:8082
      - ORDER_SERVICE_URL=http://order-service:8083
      - PAYMENT_SERVICE_URL=http://payment-service:8084
      - INVENTORY_SERVICE_URL=http://inventory-service:8085
      - SHIPPING_SERVICE_URL=http://shipping-service:8086
    depends_on:
      - product-service
      - customer-service
      - order-service
      - payment-service
      - inventory-service
      - shipping-service
    networks:
      - microservice-net
    restart: unless-stopped

  product-service:
    build: ./product-service
    ports:
      - "8081:8081"
    volumes:
      - product-data:/data
    networks:
      - microservice-net
    restart: unless-stopped

  customer-service:
    build: ./customer-service
    ports:
      - "8082:8082"
    volumes:
      - customer-data:/data
    networks:
      - microservice-net
    restart: unless-stopped

  order-service:
    build: ./order-service
    ports:
      - "8083:8083"
    environment:
      - PRODUCT_SERVICE_URL=http://product-service:8081
      - CUSTOMER_SERVICE_URL=http://customer-service:8082
      - PAYMENT_SERVICE_URL=http://payment-service:8084
      - INVENTORY_SERVICE_URL=http://inventory-service:8085
      - SHIPPING_SERVICE_URL=http://shipping-service:8086
    volumes:
      - order-data:/data
    depends_on:
      - product-service
      - customer-service
      - payment-service
      - inventory-service
      - shipping-service
    networks:
      - microservice-net
    restart: unless-stopped

  payment-service:
    build: ./payment-service
    ports:
      - "8084:8084"
    volumes:
      - payment-data:/data
    networks:
      - microservice-net
    restart: unless-stopped

  inventory-service:
    build: ./inventory-service
    ports:
      - "8085:8085"
    volumes:
      - inventory-data:/data
    networks:
      - microservice-net
    restart: unless-stopped

  shipping-service:
    build: ./shipping-service
    ports:
      - "8086:8086"
    volumes:
      - shipping-data:/data
    networks:
      - microservice-net
    restart: unless-stopped

networks:
  microservice-net:
    driver: bridge

volumes:
  product-data:
  customer-data:
  order-data:
  payment-data:
  inventory-data:
  shipping-data:
