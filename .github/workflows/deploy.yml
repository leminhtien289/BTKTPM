# XLSX B10 — CI/CD GitHub Actions
# Trigger: push to main → build api-gateway image → push Docker Hub → deploy Render.com
#
# Required GitHub Secrets:
#   DOCKER_USERNAME          — Docker Hub username
#   DOCKER_PASSWORD          — Docker Hub access token
#   RENDER_DEPLOY_HOOK_URL   — Render.com deploy hook URL
#                              (Dashboard → Service → Settings → Deploy Hook)

name: CI/CD — Build, Push & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:           # allow manual trigger from Actions tab

env:
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/microservice-api-gateway

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── Step 1: Checkout source code ─────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Step 2: Set up Docker Buildx (multi-platform + layer cache) ──────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Step 3: Login to Docker Hub ──────────────────────────────────────────
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ── Step 4+5: Build image & Push to Docker Hub ───────────────────────────
      # Tags: latest + commit SHA (enables rollback to any specific commit)
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./Tuan10/Microservice-Ecommerce/api-gateway
          file: ./Tuan10/Microservice-Ecommerce/api-gateway/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Step 6: Trigger deploy on Render.com via Deploy Hook API ─────────────
      # Render pulls the new :latest image and restarts the service
      - name: Deploy to Render.com
        run: |
          HTTP_STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" \
            --fail -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")
          echo "Render deploy hook HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "Deploy hook failed with status $HTTP_STATUS"
            exit 1
          fi

      # ── Step 7: Print deployment summary ─────────────────────────────────────
      - name: Deployment summary
        if: always()
        run: |
          echo "================================================"
          echo "  CI/CD Pipeline Result"
          echo "================================================"
          echo "  Repo    : ${{ github.repository }}"
          echo "  Branch  : ${{ github.ref_name }}"
          echo "  Commit  : ${{ github.sha }}"
          echo "  Image   : ${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "  Status  : ${{ job.status }}"
          echo "================================================"
