input {
  http {
    host => "0.0.0.0"
    port => 5000
    codec => json
  }
}

filter {
  if ![level]   { mutate { add_field => { "level"   => "info"    } } }
  if ![service] { mutate { add_field => { "service" => "unknown" } } }

  date {
    match => ["@timestamp", "ISO8601"]
    target => "@timestamp"
  }
}

output {
  elasticsearch {
    hosts        => ["http://elasticsearch:9200"]
    index        => "microservice-logs-%{+YYYY.MM.dd}"
    action       => "index"
  }
  stdout { codec => rubydebug }
}
