services:
  app:
    build: ./app
    ports:
      - "3000:3000"
    environment:
      REDIS_HOST: redis
      DB_HOST: mysql
      DB_USER: user
      DB_PASSWORD: password
      DB_NAME: mydb
    depends_on:
      - mysql
      - redis
    networks:
      - app_network

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mydb
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app_network

  redis:
    image: redis:alpine
    networks:
      - app_network

volumes:
  mysql_data:

networks:
  app_network:
    driver: bridge
