# Chạy với: docker compose up -d --build --scale flask=2
services:
  flask:
    build: .
    networks:
      - lb_network

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - flask
    networks:
      - lb_network

networks:
  lb_network:
