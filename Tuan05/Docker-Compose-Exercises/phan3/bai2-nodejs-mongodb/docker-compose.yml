services:
  mongodb:
    image: mongo:6
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
    volumes:
      - mongo_data:/data/db
    networks:
      - app_network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017 --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      MONGO_URL: mongodb://root:root@mongodb:27017
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - app_network

volumes:
  mongo_data:

networks:
  app_network:
